<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Fury Survivors</title>
  <!-- пустая иконка: без неё браузер запрашивает /favicon.ico, получает 404, и smoke ловит его как ошибку консоли -->
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
    /* dvh: высота видимой части, когда панели браузера на телефоне то появляются, то прячутся */
    #game { width: 100%; height: 100%; height: 100dvh; }
    canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
  </style>
</head>
<body>
  <div id="game"></div>
  <script src="vendor/phaser.min.js"></script>
  <script type="module" src="src/main.js"></script>
  <!-- sw.js: каждый файл перепроверяется на сервере, после деплоя достаточно перезагрузить страницу -->
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
</html>
